#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g
#Kotlin
kotlin.code.style=official
# Quartz declares its own source-set tree (jvmAndroid shared by JVM and Android, nativeMain
# above appleMain and linuxMain), so the default hierarchy template stays off.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Needed for the Swift bridge.
kotlin.mpp.enableCInteropCommonization=true
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
# Kotlin/Native links with 4 backend threads unless told otherwise, and warned "The number of
# threads 4 is more than the number of processors 3" on CI's 3-core macOS runners. 0 means one
# thread per core.
kotlin.native.parallelThreads=0
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.quartz
POM_ARTIFACT_ID=quartz
VERSION_NAME=2.26.0
# Magpie (Nostr + Blossom publishing; releases are not on Maven Central since 2.19.0). Releases go
# to the release key's own relays, the write relays of its NIP-65 list (kind 10002) and the ones
# vitorpamplona.com/.well-known/nostr.json lists for it, which is where every client looks for them.
# Index relays are only where that relay list is looked up. For more copies, add write relays to the
# key's kind 10002.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
