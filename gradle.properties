#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g
#Kotlin
kotlin.code.style=official
# Quartz declares its own source-set tree (jvmAndroid shared by JVM and Android, nativeMain
# above appleMain and linuxMain), so the default hierarchy template stays off.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Needed for the Swift bridge.
kotlin.mpp.enableCInteropCommonization=true
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.quartz
POM_ARTIFACT_ID=quartz
VERSION_NAME=2.10.1
