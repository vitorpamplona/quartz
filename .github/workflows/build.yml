name: Test/Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # For a commit on main that has no run: pushes made by GitHub Actions (the release workflow's
  # merge of a release commit) start none, and the release workflow tags only a tested commit.
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run on a PR branch, but every commit on main keeps its own run:
# the release workflow waits for the one on the commit it releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Agent config (Claude Code and Codex read the same rules and skills)
        run: tools/agent-hooks/agent_config_check.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      # Writes the Gradle cache on push to main, reads it on PRs and other branches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The native metadata compiles and assemble's Apple and Linux klibs need the toolchain.
      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      # The metadata compiles resolve commonMain against only the deps every target shares,
      # which is the Apple classpath: a dependency that reaches the JVM transitively (okio via
      # OkHttp) but is missing for iOS fails here, on Linux, instead of in test-apple. The
      # git-hooks/pre-push hook runs this same list.
      - name: Linter (gradle)
        run: |
          ./gradlew spotlessCheck \
            :quartz:verifyKmpPurity \
            :quartz:compileCommonMainKotlinMetadata \
            :quartz:compileAppleMainKotlinMetadata \
            :quartz:compileAndroidHostTest

      - name: Build (gradle)
        run: ./gradlew :quartz:assemble

  # Its own job, beside build: lint, JVM tests and assemble one after the other took ~18 min.
  test-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test JVM (gradle)
        run: ./gradlew :quartz:jvmTest

      # The console names the failing test and stops there; the annotations carry the
      # exception message (NegentropySyncException's `detail`, for one) past the runner.
      - name: JVM Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'quartz/build/test-results/jvmTest/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true

      - name: Upload JVM Test Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Quartz JVM Test Reports
          path: quartz/build/reports/tests

  # Runs the whole suite on a Linux Native frontend, which also catches a commonMain or
  # commonTest source reaching for a JVM-only API on a target that, unlike Apple, has no
  # Foundation to fall back on. Before this job existed in Amethyst nothing ran linuxX64:
  # a copy-on-write LargeCache with O(n) writes and a non-atomic read-copy-write sat
  # unnoticed, and TestResourceLoader stayed a TODO() that failed every vector suite there.
  #
  # This job and test-apple start beside build, not after it: waiting on build (~18 min) made
  # the run take ~35 min, and a release waits for this workflow on the commit it releases.
  test-linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      - name: Test Linux Native
        run: ./gradlew :quartz:linuxX64Test

      - name: Linux Native Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'quartz/build/test-results/linuxX64Test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true

      - name: Upload Linux Native Test Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Quartz Linux Native Test Reports
          path: quartz/build/reports

  # Apple test binaries link and run only on macOS. macos-latest is 3 M1 cores and 7 GB of
  # RAM, 5 to 10x slower than a laptop on Kotlin/Native links, so the daemon heap is capped at
  # 4 GB (gradle.properties asks for 6) and the test binaries link unoptimized (see
  # quartz/build.gradle.kts): an optimized iOS test link alone took 12 minutes here.
  test-apple:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      # iosSimulatorArm64Test runs the suite on the simulator, exercising secp256k1 and the
      # CommonCrypto-backed primitives on a real Apple toolchain. iosArm64 has no simulator to
      # run on; compiling its tests catches device-only drift.
      - name: Test iOS
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :quartz:iosSimulatorArm64Test \
            :quartz:compileTestKotlinIosArm64

      # Swift Package Manager users get QuartzKit.xcframework (see Package.swift). Link a debug
      # framework (the release one is an optimized link that takes many minutes here) and run a
      # Swift program against it, so a framework Swift can't import or call fails the PR. The
      # program runs on this Mac, so it only needs the macOS slice: linking the two iOS debug
      # frameworks as well took ~3.5 of this step's 7 minutes, and the release links all three.
      - name: Swift smoke test
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :quartz:linkDebugFrameworkMacosArm64
          framework="$GITHUB_WORKSPACE/quartz/build/bin/macosArm64/debugFramework/QuartzKit.framework"
          args=(-framework "$framework")
          [[ ! -d "$framework.dSYM" ]] || args+=(-debug-symbols "$framework.dSYM")
          xcodebuild -create-xcframework "${args[@]}" -output swift/QuartzKitSmoke/QuartzKit.xcframework
          swift run --package-path swift/QuartzKitSmoke

      - name: iOS Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'quartz/build/test-results/iosSimulatorArm64Test/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          fail_on_failure: true

      - name: Upload iOS Test Reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Quartz iOS Test Reports
          path: quartz/build/reports
