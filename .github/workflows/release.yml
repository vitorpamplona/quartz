name: Release

# Releases v<VERSION_NAME> when a push to main changes VERSION_NAME in gradle.properties to a
# version that is not tagged yet: merging a PR that sets VERSION_NAME=X.Y.Z releases X.Y.Z. It can
# also be run from the Actions tab on main, with the version to release.
#
# Don't push the tag by hand. Swift Package Manager reads Package.swift at the release tag, so
# that file must already name the release's QuartzKit.xcframework.zip and its checksum when the
# tag is cut. The workflow therefore builds the framework first and waits for Test/Build
# (build.yml) to pass on the same commit, then commits Package.swift (and VERSION_NAME, for a run
# from the Actions tab), tags that commit v<version>, pushes both, creates the GitHub release
# with the zip, and publishes to Maven Central.
#
# The tag sits on the release commit, a child of the commit Test/Build tested, so a PR merged
# while the release builds can't end up in it; that commit is then merged into wherever main
# has moved. Pushing to main needs GitHub Actions allowed to push there (a bypass in the branch
# ruleset when main is protected). That push does not start this workflow again: pushes made
# with GITHUB_TOKEN start no workflows, and the tag exists by then anyway. If Maven Central
# fails after the tag is pushed, re-run the failed `maven` job: it publishes from the tag.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (no leading v)'
        required: true
        type: string

# One release at a time. GitHub keeps only one run waiting behind the running one: a newer run
# cancels the waiting one, so a version bumped while another release waits is never released
# by its push. Its run shows as cancelled; release it from the Actions tab if it should exist.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether this run releases, and which version. From the Actions tab, a bad or already
  # tagged version is an error. On a push, the run releases only when VERSION_NAME changed to an
  # untagged X.Y.Z; any other edit to gradle.properties ends here without releasing.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check the version and branch
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release from main, not $GITHUB_REF"
            exit 1
          fi
          versionIn() { sed -n 's/^VERSION_NAME=//p' | tr -d '[:space:]'; }
          skip() {
            echo "::notice::$1"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(versionIn < gradle.properties)"
            git fetch --quiet --depth=1 origin "$BEFORE" || true
            PREVIOUS="$( (git show "$BEFORE:gradle.properties" 2>/dev/null || true) | versionIn)"
            [[ "$VERSION" != "$PREVIOUS" ]] || skip "VERSION_NAME is still $VERSION: nothing to release"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || skip "VERSION_NAME=$VERSION is not X.Y.Z: not released"
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION"; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || skip "v$VERSION is already tagged: nothing to release"
            echo "::error::v$VERSION is already tagged"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Compiles every target for the maven job, which builds the same sources (the release commit
  # only changes Package.swift and VERSION_NAME): it restores this cache instead of compiling
  # them all again after the tag. The tests and linters are Test/Build's; see the tested job.
  build:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The version the maven job publishes with, so its compiles match these and come from the
      # build cache this job hands over.
      ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      - name: Build (gradle)
        run: ./gradlew :quartz:assemble

      - name: Save the build cache for the maven job
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: release-build-cache-${{ github.run_id }}-${{ github.run_attempt }}

  # The release XCFramework is three optimized Kotlin/Native links of 6 to 16 minutes each on
  # the 3-core macOS runner, the slowest step of a release. One Gradle build runs them one after
  # the other (20 to 46 minutes), so each target links in its own job, in parallel, and
  # the xcframework job puts the three together.
  framework:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: iosArm64
            task: linkReleaseFrameworkIosArm64
          - target: iosSimulatorArm64
            task: linkReleaseFrameworkIosSimulatorArm64
          - target: macosArm64
            task: linkReleaseFrameworkMacosArm64
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      - name: Link the ${{ matrix.target }} framework
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -PVERSION_NAME="$VERSION" \
            :quartz:${{ matrix.task }}

      # Tarred because upload-artifact drops symlinks and file modes, and the macOS framework
      # is a versioned bundle made of symlinks.
      - name: Pack the framework and its dSYM
        run: tar -C quartz/build/bin -cf "QuartzKit-${{ matrix.target }}.tar" "${{ matrix.target }}/releaseFramework"

      - uses: actions/upload-artifact@v7
        with:
          name: QuartzKit-${{ matrix.target }}
          path: QuartzKit-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1

  xcframework:
    needs: framework
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: QuartzKit-*
          merge-multiple: true

      # What the Kotlin plugin's assembleQuartzKitReleaseXCFramework runs on the frameworks it
      # links: one -framework per target, with its dSYM when there is one, at absolute paths.
      - name: Build QuartzKit.xcframework
        run: |
          bin="$GITHUB_WORKSPACE/quartz/build/bin"
          output="$GITHUB_WORKSPACE/quartz/build/XCFrameworks/release/QuartzKit.xcframework"
          mkdir -p "$bin" "$(dirname "$output")"
          args=()
          for target in iosArm64 iosSimulatorArm64 macosArm64; do
            tar -C "$bin" -xf "QuartzKit-$target.tar"
            framework="$bin/$target/releaseFramework/QuartzKit.framework"
            args+=(-framework "$framework")
            [[ ! -d "$framework.dSYM" ]] || args+=(-debug-symbols "$framework.dSYM")
          done
          xcodebuild -create-xcframework "${args[@]}" -output "$output"

      - name: Smoke test it from Swift
        run: |
          cp -R quartz/build/XCFrameworks/release/QuartzKit.xcframework swift/QuartzKitSmoke/
          swift run --package-path swift/QuartzKitSmoke

      - name: Zip and checksum
        run: |
          cd quartz/build/XCFrameworks/release
          ditto -c -k --sequesterRsrc --keepParent QuartzKit.xcframework "$GITHUB_WORKSPACE/QuartzKit.xcframework.zip"
          cd "$GITHUB_WORKSPACE"
          swift package compute-checksum QuartzKit.xcframework.zip > QuartzKit.xcframework.zip.sha256
          cat QuartzKit.xcframework.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: QuartzKit.xcframework
          path: |
            QuartzKit.xcframework.zip
            QuartzKit.xcframework.zip.sha256
          if-no-files-found: error

  # The tests and linters are Test/Build's (build.yml): the push to main that starts a release
  # starts it on the same commit, and a run from the Actions tab releases a commit it already
  # ran on. Instead of running them all a second time, the release tags only once that run has
  # passed. Its slowest job, test-apple (17 to 21 minutes), takes about as long as the
  # framework links, so this job starts after them and waits a few minutes at most.
  tested:
    needs: xcframework
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read

    steps:
      - name: Wait for Test/Build to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors=0
          while true; do
            if ! run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&head_sha=$GITHUB_SHA&per_page=1" \
              --jq '.workflow_runs[0] // empty | [.status, (.conclusion // "none"), .html_url] | @tsv')"; then
              errors=$((errors + 1))
              if (( errors >= 5 )); then
                echo "::error::The GitHub API failed 5 times in a row; re-run this job."
                exit 1
              fi
              sleep 30
              continue
            fi
            errors=0
            if [[ -z "$run" ]]; then
              echo "::error::Test/Build has no run on $GITHUB_SHA (pushes made by GitHub Actions start none). While main is still at that commit, run Test/Build on main from the Actions tab, then re-run this job."
              exit 1
            fi
            IFS=$'\t' read -r status conclusion url <<< "$run"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "Test/Build passed on $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::Test/Build ended '$conclusion' on $GITHUB_SHA: $url. Fix or re-run it, then re-run this job."
              exit 1
            fi
            echo "Test/Build is $status: $url"
            sleep 60
          done

  tag:
    needs: [check-version, build, xcframework, tested]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: QuartzKit.xcframework

      # On the commit these jobs tested, not on main: main may have moved since, and the tag
      # must hold exactly what was tested. A re-run of this job after the tag was pushed (the
      # GitHub release failed, say) keeps that tag, as long as it names this run's zip: a new
      # release commit would have another SHA, and the tag can't be pushed twice.
      - name: Commit and tag the release
        run: |
          checksum="$(cat QuartzKit.xcframework.zip.sha256)"
          if git rev-parse --quiet --verify "refs/tags/v$VERSION" > /dev/null; then
            if ! git show "v$VERSION:Package.swift" | grep -qF "checksum: \"$checksum\""; then
              echo "::error::v$VERSION is already tagged, with another QuartzKit.xcframework.zip checksum than this run built"
              exit 1
            fi
            echo "::notice::v$VERSION is already tagged with this run's zip: releasing that tag"
            exit 0
          fi
          tools/release/prepare-release.sh "$VERSION" "$checksum"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v$VERSION" -- gradle.properties Package.swift
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            QuartzKit.xcframework.zip
            QuartzKit.xcframework.zip.sha256

      # A fast-forward when main hasn't moved, else a merge (the release commit only touches
      # Package.swift and VERSION_NAME), retried if main moves again in between. The release is
      # already out by now, so a failure here is a warning, not a reason to skip Maven Central.
      #
      # When the previous release reached main after this one started, main's Package.swift
      # already holds that release's url and checksum, on the lines this release rewrites. That
      # conflict resolves to this release's lines: releases run one at a time, so it is the
      # newest. Any other conflict is left for a person.
      - name: Bring the release commit into main
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release="v$VERSION^{commit}"
          message="chore(release): merge v$VERSION into main"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout --quiet --detach origin/main
            if git merge-base --is-ancestor HEAD "$release"; then
              target="$(git rev-parse "$release")"
            elif git merge --no-ff --quiet -m "$message" "$release"; then
              target="$(git rev-parse HEAD)"
            elif [[ "$(git diff --name-only --diff-filter=U)" == "Package.swift" ]]; then
              git checkout --theirs -- Package.swift
              git add Package.swift
              git commit --quiet -m "$message"
              target="$(git rev-parse HEAD)"
            else
              git merge --abort || true
              echo "::warning::v$VERSION's release commit does not merge into main; merge it by hand"
              exit 1
            fi
            if git push origin "$target:refs/heads/main"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::warning::main kept moving; merge v$VERSION's release commit into it by hand"
          exit 1

  # Apple klibs cross-compile on Linux; only Apple test and framework binaries need a Mac.
  maven:
    needs: [check-version, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache Kotlin/Native toolchain
        uses: ./.github/actions/cache-konan

      - name: Restore the build job's build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: release-build-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: release-build-cache-${{ github.run_id }}-

      - name: Publish
        run: ./gradlew :quartz:publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
