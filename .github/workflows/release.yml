name: Release

# Releases v<VERSION_NAME> when a push to main changes VERSION_NAME in gradle.properties to a
# version that is not tagged yet: merging a PR that sets VERSION_NAME=X.Y.Z releases X.Y.Z. It can
# also be run from the Actions tab on main, with the version to release.
#
# Don't push the tag by hand. Swift Package Manager reads Package.swift at the release tag, so
# that file must already name the release's QuartzKit.xcframework.zip and its checksum when the
# tag is cut. The workflow therefore builds the framework first, then commits Package.swift (and
# VERSION_NAME, for a run from the Actions tab), tags that commit v<version>, pushes both,
# creates the GitHub release with the zip, and publishes to Maven Central.
#
# Pushing the release commit to main needs GitHub Actions allowed to push there (a bypass in
# the branch ruleset when main is protected). That push does not start this workflow again:
# pushes made with GITHUB_TOKEN start no workflows, and the tag exists by then anyway. If Maven
# Central fails after the tag is pushed, re-run the failed `maven` job: it publishes from the tag.
on:
  push:
    branches: [main]
    paths: [gradle.properties]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (no leading v)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decides whether this run releases, and which version. From the Actions tab, a bad or already
  # tagged version is an error. On a push, the run releases only when VERSION_NAME changed to an
  # untagged X.Y.Z; any other edit to gradle.properties ends here without releasing.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check the version and branch
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release from main, not $GITHUB_REF"
            exit 1
          fi
          versionIn() { sed -n 's/^VERSION_NAME=//p' | tr -d '[:space:]'; }
          skip() {
            echo "::notice::$1"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(versionIn < gradle.properties)"
            git fetch --quiet --depth=1 origin "$BEFORE" || true
            PREVIOUS="$( (git show "$BEFORE:gradle.properties" 2>/dev/null || true) | versionIn)"
            [[ "$VERSION" != "$PREVIOUS" ]] || skip "VERSION_NAME is still $VERSION: nothing to release"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || skip "VERSION_NAME=$VERSION is not X.Y.Z: not released"
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION"; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || skip "v$VERSION is already tagged: nothing to release"
            echo "::error::v$VERSION is already tagged"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  check:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Linter (gradle)
        run: |
          ./gradlew spotlessCheck \
            :quartz:verifyKmpPurity \
            :quartz:compileCommonMainKotlinMetadata \
            :quartz:compileAppleMainKotlinMetadata \
            :quartz:compileAndroidHostTest

      - name: Check
        run: ./gradlew :quartz:jvmTest :quartz:linuxX64Test

      - name: Build (gradle)
        run: ./gradlew :quartz:assemble

  test-apple:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Test iOS
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :quartz:iosSimulatorArm64Test \
            :quartz:compileTestKotlinIosArm64

  # The release XCFramework is three optimized Kotlin/Native links, the slowest step of a
  # release on the 3-core macOS runner; it runs alongside the tests.
  xcframework:
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Build QuartzKit.xcframework
        run: |
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -PVERSION_NAME="$VERSION" \
            :quartz:assembleQuartzKitReleaseXCFramework

      - name: Smoke test it from Swift
        run: |
          cp -R quartz/build/XCFrameworks/release/QuartzKit.xcframework swift/QuartzKitSmoke/
          swift run --package-path swift/QuartzKitSmoke

      - name: Zip and checksum
        run: |
          cd quartz/build/XCFrameworks/release
          ditto -c -k --sequesterRsrc --keepParent QuartzKit.xcframework "$GITHUB_WORKSPACE/QuartzKit.xcframework.zip"
          cd "$GITHUB_WORKSPACE"
          swift package compute-checksum QuartzKit.xcframework.zip > QuartzKit.xcframework.zip.sha256
          cat QuartzKit.xcframework.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: QuartzKit.xcframework
          path: |
            QuartzKit.xcframework.zip
            QuartzKit.xcframework.zip.sha256
          if-no-files-found: error

  tag:
    needs: [check-version, check, test-apple, xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: QuartzKit.xcframework

      - name: Commit and tag the release
        run: |
          tools/release/prepare-release.sh "$VERSION" "$(cat QuartzKit.xcframework.zip.sha256)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v$VERSION" -- gradle.properties Package.swift
          git tag "v$VERSION"
          # Fails without a force if main moved since the release started: the tag must sit on
          # the commit these jobs tested. Run the release again from the new main.
          git push origin "HEAD:refs/heads/main"
          git push origin "v$VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            QuartzKit.xcframework.zip
            QuartzKit.xcframework.zip.sha256

  # Apple klibs cross-compile on Linux; only Apple test and framework binaries need a Mac.
  maven:
    needs: [check-version, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ env.VERSION }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Publish
        run: ./gradlew :quartz:publishAllPublicationsToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
